stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  tags:
    - linux
  script:
    - echo "Собираем Go-приложение..."
    - docker build -t my-go-app .

test-job:
  stage: test
  tags:
    - linux
  script:
    - echo "Запускаем тесты..."
    - echo "Все тесты прошли успешно!"

deploy-job:
  stage: deploy
  tags:
    - linux
  script:
    - echo "Деплоим в Kubernetes..."
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl rollout status deployment/my-go-app --timeout=60s
    - echo "Деплой завершён!"
  environment:
    name: staging
    url: http://minikube:30080
  only:
    - main
