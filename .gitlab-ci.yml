include:
  - template: Security/SAST.gitlab-ci.yml
stages:
  - build
  - test
  - deploy
  - review
  - cleanup

variables:
  APP_NAME: my-go-app

# ---------- BUILD ----------
build-job:
  stage: build
  tags:
    - linux
  script:
    - echo "Собираем Docker-образ..."
    - docker build -t $APP_NAME:latest .
    - echo "Образ собран!"
  only:
    - main
    - merge_requests

# ---------- TEST ----------
test-job:
  stage: test
  tags:
    - linux
  script:
    - echo "Запускаем тесты..."
    - echo "Все тесты прошли успешно!"
  only:
    - main
    - merge_requests

# ---------- VAULT TEST ----------
vault-test:
  stage: test
  tags:
    - linux
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://gitlab.com
  script:
    - export VAULT_ADDR=http://127.0.0.1:8200
    - export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role=myproject-staging jwt=$VAULT_ID_TOKEN)
    - echo "Vault token obtained!"
    - vault kv get secret/myproject/staging/db-password
  only:
    - main

# ---------- DEPLOY (только main) ----------
deploy-job:
  stage: deploy
  tags:
    - linux
  script:
    - export KUBECONFIG=/home/gitlab-runner/.kube/config
    - echo "KUBECONFIG=$KUBECONFIG"
    - kubectl config view --minify | grep server
    - echo "Деплоим в production..."
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
    - kubectl rollout status deployment/my-go-app --timeout=60s
    - echo "Деплой завершён!"
  environment:
    name: production
    url: http://minikube:30080
  only:
    - main

# ---------- REVIEW (для MR) ----------
deploy-review:
  stage: review
  tags:
    - linux
  variables:
    KUBECONFIG: /home/gitlab-runner/.kube/config
  script:
    - echo "Создаём review-окружение для ветки $CI_COMMIT_REF_SLUG"
    - echo "KUBECONFIG=$KUBECONFIG"
    - echo "HOME=$HOME"
    - which kubectl
    - kubectl config view --minify | grep server
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: example.com/v1
      kind: DynamicEnvironment
      metadata:
        name: $CI_COMMIT_REF_SLUG
        namespace: default
      spec:
        appName: $APP_NAME
        branch: $CI_COMMIT_REF_SLUG
      EOF
    - sleep 10
    - kubectl get namespace review-$CI_COMMIT_REF_SLUG
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: http://localhost:8080
    on_stop: stop-review
  only:
    - merge_requests

# ---------- STOP REVIEW ----------
stop-review:
  stage: cleanup
  tags:
    - linux
  script:
    - echo "Удаляем review-окружение для ветки $CI_COMMIT_REF_SLUG"
    - kubectl delete dynamicenvironment $CI_COMMIT_REF_SLUG --ignore-not-found=true
    - echo "Review-окружение удалено!"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  when: manual
  only:
    - merge_requests
